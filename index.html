<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today - 待办与计划</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --panel: #ffffff;
      --ink: #262522;
      --muted: #85827c;
      --line: #ece9e3;
      --accent: #e95e43;
      --accent-soft: #fff0ec;
      --high: #e2504c;
      --high-bg: #fcebea;
      --medium: #d98b27;
      --medium-bg: #fff4df;
      --low: #7d8288;
      --low-bg: #f1f2f2;
      --green: #54916d;
      --shadow: 0 10px 32px rgba(50, 45, 36, .06);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 14px;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; border: 0; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 236px 1fr; }

    .sidebar {
      padding: 26px 18px;
      border-right: 1px solid var(--line);
      background: #f2f1ee;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 9px 24px; font-weight: 750; font-size: 16px; }
    .brand-mark { width: 28px; height: 28px; display: grid; place-items: center; color: white; border-radius: 9px; background: var(--accent); font-size: 18px; }
    .nav { display: grid; gap: 3px; }
    .nav-btn {
      display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 11px;
      color: #65625d; text-align: left; border-radius: 9px; background: transparent;
    }
    .nav-btn:hover { background: rgba(255,255,255,.65); }
    .nav-btn.active { color: #d74f39; background: #fff; font-weight: 650; box-shadow: 0 2px 8px rgba(50,45,36,.04); }
    .nav-icon { width: 18px; text-align: center; }
    .nav-count { margin-left: auto; padding: 1px 7px; color: var(--muted); border-radius: 10px; background: rgba(0,0,0,.045); font-size: 11px; }
    .sidebar-note { margin: 30px 9px; padding-top: 18px; color: var(--muted); border-top: 1px solid #e3e0da; font-size: 12px; line-height: 1.7; }

    main { padding: 42px 46px 60px; overflow: hidden; }
    .topbar { display: flex; gap: 20px; align-items: center; justify-content: space-between; margin-bottom: 30px; }
    .topbar h1 { margin: 0 0 6px; letter-spacing: -.6px; font-size: 28px; }
    .date-line { color: var(--muted); }
    .top-actions { display: flex; gap: 9px; align-items: center; }
    .settings-btn { display: grid; width: 40px; height: 40px; place-items: center; color: #77736e; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 18px; }
    .settings-btn:hover { color: var(--accent); background: var(--accent-soft); }
    .search { position: relative; }
    .search input {
      width: 260px; padding: 11px 15px 11px 38px; border: 1px solid var(--line);
      border-radius: 12px; outline: 0; background: var(--panel); transition: .2s;
    }
    .search input:focus { border-color: #e6b1a6; box-shadow: 0 0 0 3px var(--accent-soft); }
    .search span { position: absolute; left: 14px; top: 10px; color: var(--muted); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 22px; align-items: start; }
    .card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }

    .task-card { overflow: hidden; }
    .extractor { padding: 18px; border-bottom: 1px solid var(--line); background: #fffaf8; }
    .extractor-title { display: flex; gap: 8px; align-items: center; margin-bottom: 5px; font-weight: 700; }
    .extractor-badge { padding: 3px 7px; color: var(--accent); border-radius: 10px; background: var(--accent-soft); font-size: 10px; }
    .extractor-hint { margin: 0 0 11px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .extractor-input { display: flex; gap: 9px; align-items: stretch; }
    .extractor textarea {
      width: 100%; min-height: 70px; padding: 10px 11px; resize: vertical; color: var(--ink);
      border: 1px solid var(--line); border-radius: 9px; outline: 0; background: #fff; line-height: 1.6;
    }
    .extractor textarea:focus { border-color: #e6b1a6; box-shadow: 0 0 0 3px var(--accent-soft); }
    .extract-btn { flex: 0 0 auto; padding: 0 14px; color: #fff; border-radius: 9px; background: var(--accent); font-weight: 650; }
    .extract-preview { display: none; margin-top: 13px; }
    .extract-preview.visible { display: block; }
    .extract-preview-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; color: var(--muted); font-size: 11px; }
    .draft-list { display: grid; gap: 7px; }
    .draft-item {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
      padding: 9px 10px; border: 1px solid #f0e4df; border-radius: 9px; background: #fff;
    }
    .draft-item.muted { opacity: .5; }
    .draft-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .draft-actions { display: flex; gap: 3px; }
    .draft-actions .icon-btn { font-weight: 750; }
    .draft-actions .selected { color: var(--green); background: #edf6f0; }
    .batch-add { margin-top: 10px; padding: 9px 13px; color: #fff; border-radius: 8px; background: var(--green); font-size: 12px; font-weight: 650; }
    .add-bar { display: flex; align-items: center; gap: 10px; padding: 17px 18px; border-bottom: 1px solid var(--line); }
    .add-btn { display: grid; flex: 0 0 auto; width: 25px; height: 25px; place-items: center; color: white; border-radius: 50%; background: var(--accent); font-size: 20px; line-height: 1; }
    .add-bar input { flex: 1; min-width: 0; padding: 5px 0; border: 0; outline: 0; color: var(--ink); }
    .mini-select, .mini-date {
      max-width: 94px; padding: 7px 4px; color: #706d67; border: 1px solid var(--line); border-radius: 8px; outline: 0; background: #fff; font-size: 12px;
    }
    .mini-date { max-width: 122px; }
    .task-head { display: flex; align-items: center; justify-content: space-between; padding: 17px 19px 10px; }
    .task-head h2, .plan h2 { margin: 0; font-size: 15px; }
    .sort-select { padding: 6px; color: var(--muted); border: 0; outline: 0; background: transparent; font-size: 12px; }
    .task-list { padding: 0 10px 12px; }
    .section-label { padding: 14px 10px 7px; color: var(--muted); font-weight: 650; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .task {
      display: grid; grid-template-columns: auto 1fr auto; gap: 11px; align-items: center;
      padding: 12px 10px; border-radius: 9px; transition: .16s;
    }
    .task:hover { background: #faf9f7; }
    .check { width: 18px; height: 18px; border: 1.5px solid #c9c5bf; border-radius: 50%; background: #fff; }
    .task.completed .check { color: #fff; border-color: var(--green); background: var(--green); }
    .task.completed .check::after { content: "✓"; position: relative; left: 3px; top: -1px; font-size: 12px; }
    .task-main { min-width: 0; }
    .task-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task.completed .task-title { color: #aaa6a0; text-decoration: line-through; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; padding-top: 5px; color: var(--muted); font-size: 11px; }
    .priority { padding: 2px 6px; border-radius: 5px; font-size: 10px; font-weight: 700; }
    .priority.high { color: var(--high); background: var(--high-bg); }
    .priority.medium { color: var(--medium); background: var(--medium-bg); }
    .priority.low { color: var(--low); background: var(--low-bg); }
    .deadline.overdue { color: var(--high); font-weight: 650; }
    .actions { display: flex; gap: 3px; opacity: 0; transition: .16s; }
    .task:hover .actions { opacity: 1; }
    .icon-btn { padding: 5px; color: var(--muted); border-radius: 6px; background: transparent; }
    .icon-btn:hover { color: var(--ink); background: var(--line); }
    .empty { padding: 50px 16px; color: var(--muted); text-align: center; line-height: 1.8; }

    .plan { padding: 19px; position: sticky; top: 24px; }
    .plan-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
    .plan-sub { margin: 0 0 16px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .plan-list { display: grid; gap: 8px; min-height: 68px; }
    .plan-item {
      display: grid; grid-template-columns: auto 1fr; gap: 9px; align-items: center;
      padding: 11px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fdfcfb;
    }
    .plan-item.dragging { opacity: .45; }
    .grip { color: #bbb7b1; cursor: grab; font-size: 15px; letter-spacing: -4px; }
    .plan-item .task-title { font-size: 13px; }
    .plan-num { display: inline-grid; width: 17px; height: 17px; margin-right: 6px; place-items: center; color: #918c85; border-radius: 50%; background: #efede9; font-size: 10px; }
    .plan-foot { margin-top: 15px; padding-top: 13px; color: var(--muted); border-top: 1px solid var(--line); font-size: 11px; line-height: 1.6; }
    .refresh { color: var(--accent); background: transparent; font-size: 12px; }

    .modal-backdrop { position: fixed; inset: 0; display: none; place-items: center; padding: 18px; background: rgba(37,35,31,.28); z-index: 4; }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(420px, 100%); padding: 22px; border-radius: 15px; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.14); }
    .modal h3 { margin: 0 0 18px; font-size: 17px; }
    .modal-copy { margin: -8px 0 15px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .field { display: grid; gap: 7px; margin: 12px 0; color: var(--muted); font-size: 12px; }
    .field input, .field select { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px; outline: none; }
    .sync-state { margin-top: 12px; padding: 10px; color: var(--muted); border-radius: 8px; background: #f8f7f5; font-size: 12px; line-height: 1.6; }
    .sync-state.success { color: var(--green); background: #edf6f0; }
    .sync-state.error { color: var(--high); background: var(--high-bg); }
    .danger-link { margin-right: auto; color: var(--high); background: transparent; font-size: 12px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .btn { padding: 9px 15px; border-radius: 8px; color: #6f6b65; background: #f2f0ed; }
    .btn.primary { color: #fff; background: var(--accent); }

    @media (max-width: 900px) {
      .app { grid-template-columns: 72px 1fr; }
      .sidebar { padding-inline: 11px; }
      .brand { justify-content: center; padding-inline: 0; }
      .brand-text, .nav-label, .nav-count, .sidebar-note { display: none; }
      .nav-btn { justify-content: center; padding: 11px; }
      main { padding: 30px 24px 50px; }
      .layout { grid-template-columns: 1fr; }
      .plan { position: static; grid-row: 1; }
    }
    @media (max-width: 620px) {
      .app { display: block; }
      .sidebar { position: fixed; inset: auto 0 0; z-index: 3; padding: 7px 10px; border-top: 1px solid var(--line); border-right: 0; }
      .brand, .sidebar-note { display: none; }
      .nav { grid-template-columns: repeat(4, 1fr); }
      .nav-btn { display: grid; gap: 2px; justify-items: center; padding: 7px 3px; font-size: 10px; }
      .nav-label { display: block; }
      main { padding: 24px 14px 84px; }
      .topbar { display: block; margin-bottom: 20px; }
      .topbar h1 { font-size: 24px; }
      .search { margin-top: 16px; }
      .top-actions { margin-top: 16px; }
      .search input { width: 100%; }
      .add-bar { flex-wrap: wrap; }
      .add-bar input { width: calc(100% - 38px); flex-basis: calc(100% - 38px); }
      .extractor-input { display: grid; }
      .extract-btn { padding: 10px; }
      .mini-date { max-width: none; flex: 1; }
      .actions { opacity: 1; }
      .layout { gap: 15px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">✓</span><span class="brand-text">Today</span></div>
      <nav class="nav" id="nav">
        <button class="nav-btn active" data-view="all"><span class="nav-icon">☰</span><span class="nav-label">全部事项</span><span class="nav-count" id="count-all">0</span></button>
        <button class="nav-btn" data-view="today"><span class="nav-icon">◷</span><span class="nav-label">今日</span><span class="nav-count" id="count-today">0</span></button>
        <button class="nav-btn" data-view="week"><span class="nav-icon">□</span><span class="nav-label">本周</span><span class="nav-count" id="count-week">0</span></button>
        <button class="nav-btn" data-view="done"><span class="nav-icon">✓</span><span class="nav-label">已完成</span><span class="nav-count" id="count-done">0</span></button>
      </nav>
      <div class="sidebar-note">把重要的事放在眼前，<br>一次只专注一步。</div>
    </aside>

    <main>
      <header class="topbar">
        <div><h1 id="view-title">全部事项</h1><div class="date-line" id="date-line"></div></div>
        <div class="top-actions">
          <label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索事项..."></label>
          <button class="settings-btn" id="open-settings" title="同步设置" aria-label="同步设置">⚙</button>
        </div>
      </header>
      <div class="layout">
        <section class="card task-card">
          <section class="extractor">
            <div class="extractor-title">智能事项提取 <span class="extractor-badge">本地解析</span></div>
            <p class="extractor-hint">输入一段话，自动识别其中的事项、截止日期和优先级。</p>
            <div class="extractor-input">
              <textarea id="extract-text" placeholder="例如：明天下午3点前记得交会计作业，周末要复习中级财务会计第三章"></textarea>
              <button class="extract-btn" id="extract-btn" type="button">智能提取</button>
            </div>
            <div class="extract-preview" id="extract-preview">
              <div class="extract-preview-head"><span id="extract-summary"></span><span>✓ 选择加入 · ✗ 移除</span></div>
              <div class="draft-list" id="draft-list"></div>
              <button class="batch-add" id="batch-add" type="button">批量添加到待办列表</button>
            </div>
          </section>
          <form class="add-bar" id="add-form">
            <button class="add-btn" title="添加事项" aria-label="添加事项">+</button>
            <input id="new-title" required autocomplete="off" placeholder="添加一个新的待办事项">
            <select class="mini-select" id="new-priority" aria-label="优先级">
              <option value="medium">中优先级</option><option value="high">高优先级</option><option value="low">低优先级</option>
            </select>
            <input class="mini-date" id="new-date" type="date" aria-label="截止日期">
          </form>
          <div class="task-head">
            <h2 id="list-title">任务清单</h2>
            <select class="sort-select" id="sort">
              <option value="smart">智能排序</option><option value="priority">按优先级</option><option value="date">按截止日期</option>
            </select>
          </div>
          <div class="task-list" id="task-list"></div>
        </section>

        <aside class="card plan">
          <div class="plan-title"><h2>今日推荐计划</h2><button class="refresh" id="refresh-plan">重新生成</button></div>
          <p class="plan-sub">根据优先级和截止日期生成。拖动任务可调整执行顺序。</p>
          <div class="plan-list" id="plan-list"></div>
          <div class="plan-foot">建议先完成 3 - 5 项最重要的任务。清晰的顺序，会让一天轻松很多。</div>
        </aside>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="modal">
    <form class="modal" id="edit-form">
      <h3>编辑事项</h3>
      <label class="field">事项标题<input id="edit-title" required></label>
      <label class="field">优先级<select id="edit-priority"><option value="high">高优先级</option><option value="medium">中优先级</option><option value="low">低优先级</option></select></label>
      <label class="field">截止日期<input id="edit-date" type="date"></label>
      <div class="modal-actions"><button class="btn" type="button" id="cancel-edit">取消</button><button class="btn primary">保存修改</button></div>
    </form>
  </div>

  <div class="modal-backdrop" id="settings-modal">
    <form class="modal" id="settings-form">
      <h3>多设备同步</h3>
      <p class="modal-copy">使用 GitHub Gist 保存待办数据。建议创建仅包含 <strong>gist</strong> 权限的 Personal Access Token，不要使用包含仓库或账户管理权限的 Token。</p>
      <label class="field">GitHub Personal Access Token<input id="github-token" type="password" autocomplete="off" placeholder="输入仅有 gist 权限的 Token"></label>
      <div class="sync-state" id="sync-state">尚未启用同步。保存 Token 后会自动创建或连接 Gist。</div>
      <div class="modal-actions">
        <button class="danger-link" id="disable-sync" type="button">停用同步</button>
        <button class="btn" id="close-settings" type="button">稍后设置</button>
        <button class="btn" id="sync-now" type="button">立即同步</button>
        <button class="btn primary">保存并同步</button>
      </div>
    </form>
  </div>

  <script>
    const TASK_KEY = "today.tasks.v2";
    const PLAN_KEY = "today.plan.v2";
    const GITHUB_TOKEN_KEY = "today.githubToken.v1";
    const GIST_ID_KEY = "today.gistId.v1";
    const GIST_FILENAME = "todo-app-data.json";
    const $ = (id) => document.getElementById(id);
    const priorityWeight = { high: 3, medium: 2, low: 1 };
    const priorityText = { high: "高", medium: "中", low: "低" };
    const titles = { all: "全部事项", today: "今日事项", week: "本周事项", done: "已完成事项" };
    const dayMs = 86400000;
    let currentView = "all";
    let editingId = null;
    let extractedDrafts = [];
    let syncTimer = null;
    let cloudApplying = false;

    function localDate(offset = 0) {
      const date = new Date();
      date.setDate(date.getDate() + offset);
      return date.toLocaleDateString("sv-SE");
    }
    const initialTasks = [
      { title: "整理本周的工作重点", priority: "high", due: localDate(0) },
      { title: "预约年度体检", priority: "medium", due: localDate(2) },
      { title: "阅读 30 分钟", priority: "low", due: localDate(0) },
      { title: "更新项目进度文档", priority: "high", due: localDate(5) }
    ];
    let tasks = JSON.parse(localStorage.getItem(TASK_KEY) || "null") || initialTasks.map((task, index) => ({ ...task, id: Date.now() + index, completed: false, createdAt: Date.now() + index }));
    let plan = JSON.parse(localStorage.getItem(PLAN_KEY) || "null") || [];

    function save() {
      localStorage.setItem(TASK_KEY, JSON.stringify(tasks));
      localStorage.setItem(PLAN_KEY, JSON.stringify(plan));
      scheduleCloudPush();
    }
    function syncPayload() {
      return { tasks, plan, updatedAt: new Date().toISOString() };
    }
    function setSyncState(message, type = "") {
      $("sync-state").textContent = message;
      $("sync-state").className = `sync-state ${type}`.trim();
    }
    function githubHeaders() {
      return { Accept: "application/vnd.github+json", Authorization: `Bearer ${localStorage.getItem(GITHUB_TOKEN_KEY)}`, "X-GitHub-Api-Version": "2022-11-28" };
    }
    function scheduleCloudPush() {
      if (cloudApplying || !localStorage.getItem(GITHUB_TOKEN_KEY)) return;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => pushCloudData().catch(() => {}), 900);
    }
    async function findOrCreateGist() {
      let gistId = localStorage.getItem(GIST_ID_KEY);
      if (gistId) return gistId;
      const listResponse = await fetch("https://api.github.com/gists?per_page=100", { headers: githubHeaders() });
      if (!listResponse.ok) throw new Error("Token 无效，或缺少 gist 权限");
      const gists = await listResponse.json();
      const existing = gists.find(gist => gist.files && gist.files[GIST_FILENAME]);
      if (existing) {
        gistId = existing.id;
      } else {
        const createResponse = await fetch("https://api.github.com/gists", {
          method: "POST",
          headers: { ...githubHeaders(), "Content-Type": "application/json" },
          body: JSON.stringify({ description: "Today todo app sync data", public: false, files: { [GIST_FILENAME]: { content: JSON.stringify(syncPayload(), null, 2) } } })
        });
        if (!createResponse.ok) throw new Error("无法创建 Gist，请检查 Token 的 gist 权限");
        gistId = (await createResponse.json()).id;
      }
      localStorage.setItem(GIST_ID_KEY, gistId);
      return gistId;
    }
    async function pushCloudData() {
      if (!localStorage.getItem(GITHUB_TOKEN_KEY)) return;
      clearTimeout(syncTimer);
      setSyncState("正在上传到 GitHub Gist...");
      const gistId = await findOrCreateGist();
      const response = await fetch(`https://api.github.com/gists/${gistId}`, {
        method: "PATCH",
        headers: { ...githubHeaders(), "Content-Type": "application/json" },
        body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(syncPayload(), null, 2) } } })
      });
      if (!response.ok) throw new Error("上传失败，请检查网络或 Token 权限");
      setSyncState(`同步成功：${new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })}`, "success");
    }
    async function pullCloudData() {
      if (!localStorage.getItem(GITHUB_TOKEN_KEY)) return;
      setSyncState("正在从 GitHub Gist 获取最新数据...");
      const gistId = await findOrCreateGist();
      const response = await fetch(`https://api.github.com/gists/${gistId}`, { headers: githubHeaders() });
      if (!response.ok) throw new Error("无法读取 Gist，请检查 Token");
      const gist = await response.json();
      const file = gist.files && gist.files[GIST_FILENAME];
      if (!file) throw new Error("Gist 中缺少同步文件");
      const cloud = JSON.parse(file.content);
      const mergedTasks = new Map(tasks.map(task => [task.id, task]));
      (cloud.tasks || []).forEach(task => mergedTasks.set(task.id, task));
      cloudApplying = true;
      tasks = Array.from(mergedTasks.values());
      plan = Array.isArray(cloud.plan) ? cloud.plan : plan;
      localStorage.setItem(TASK_KEY, JSON.stringify(tasks));
      localStorage.setItem(PLAN_KEY, JSON.stringify(plan));
      render();
      cloudApplying = false;
      setSyncState(`已拉取云端数据：${new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })}`, "success");
    }
    async function syncNow() {
      try {
        await pullCloudData();
        await pushCloudData();
      } catch (error) {
        setSyncState(error.message, "error");
        throw error;
      }
    }
    function daysUntil(date) {
      if (!date) return 9999;
      const start = new Date(localDate()).getTime();
      return Math.round((new Date(date + "T00:00:00").getTime() - start) / dayMs);
    }
    function smartCompare(a, b) {
      return (priorityWeight[b.priority] - priorityWeight[a.priority]) || (daysUntil(a.due) - daysUntil(b.due)) || (a.createdAt - b.createdAt);
    }
    function dueText(due) {
      if (!due) return "无截止日期";
      const diff = daysUntil(due);
      if (diff < 0) return `已逾期 ${Math.abs(diff)} 天`;
      if (diff === 0) return "今天截止";
      if (diff === 1) return "明天截止";
      return `${due.slice(5).replace("-", "月")}日截止`;
    }
    function inCurrentView(task) {
      const diff = daysUntil(task.due);
      if (currentView === "today") return !task.completed && diff === 0;
      if (currentView === "week") return !task.completed && diff >= 0 && diff <= 7;
      if (currentView === "done") return task.completed;
      return true;
    }
    function filteredTasks() {
      const keyword = $("search").value.trim().toLowerCase();
      const visible = tasks.filter(task => inCurrentView(task) && task.title.toLowerCase().includes(keyword));
      const sortBy = $("sort").value;
      return visible.sort((a, b) => {
        if (a.completed !== b.completed) return a.completed - b.completed;
        if (sortBy === "priority") return priorityWeight[b.priority] - priorityWeight[a.priority];
        if (sortBy === "date") return daysUntil(a.due) - daysUntil(b.due);
        return smartCompare(a, b);
      });
    }
    function taskMarkup(task) {
      return `<article class="task ${task.completed ? "completed" : ""}">
        <button class="check" data-action="toggle" data-id="${task.id}" aria-label="${task.completed ? "标记未完成" : "标记完成"}"></button>
        <div class="task-main"><div class="task-title">${escapeHtml(task.title)}</div>
          <div class="meta"><span class="priority ${task.priority}">${priorityText[task.priority]}优先级</span><span class="deadline ${daysUntil(task.due) < 0 && !task.completed ? "overdue" : ""}">${dueText(task.due)}</span></div>
        </div>
        <div class="actions"><button class="icon-btn" data-action="edit" data-id="${task.id}" title="编辑">✎</button><button class="icon-btn" data-action="delete" data-id="${task.id}" title="删除">×</button></div>
      </article>`;
    }
    function renderTasks() {
      const visible = filteredTasks();
      if (!visible.length) {
        $("task-list").innerHTML = `<div class="empty">这里暂时没有事项<br>从上方添加一个新任务吧</div>`;
      } else if (currentView === "all") {
        const open = visible.filter(task => !task.completed);
        const done = visible.filter(task => task.completed);
        $("task-list").innerHTML = `${open.length ? `<div class="section-label">进行中 · ${open.length}</div>${open.map(taskMarkup).join("")}` : ""}${done.length ? `<div class="section-label">已完成 · ${done.length}</div>${done.map(taskMarkup).join("")}` : ""}`;
      } else {
        $("task-list").innerHTML = visible.map(taskMarkup).join("");
      }
      const undone = tasks.filter(task => !task.completed);
      $("count-all").textContent = undone.length;
      $("count-today").textContent = undone.filter(task => daysUntil(task.due) === 0).length;
      $("count-week").textContent = undone.filter(task => daysUntil(task.due) >= 0 && daysUntil(task.due) <= 7).length;
      $("count-done").textContent = tasks.filter(task => task.completed).length;
    }
    function validPlanIds() {
      const openIds = new Set(tasks.filter(task => !task.completed).map(task => task.id));
      return plan.filter(id => openIds.has(id));
    }
    function generatePlan() {
      plan = tasks.filter(task => !task.completed).sort(smartCompare).slice(0, 5).map(task => task.id);
      save();
      renderPlan();
    }
    function renderPlan() {
      plan = validPlanIds();
      if (!plan.length && tasks.some(task => !task.completed)) plan = tasks.filter(task => !task.completed).sort(smartCompare).slice(0, 5).map(task => task.id);
      const planned = plan.map(id => tasks.find(task => task.id === id)).filter(Boolean);
      $("plan-list").innerHTML = planned.length ? planned.map((task, i) => `<div class="plan-item" draggable="true" data-plan-id="${task.id}">
        <span class="grip">⠿</span><div><div class="task-title"><span class="plan-num">${i + 1}</span>${escapeHtml(task.title)}</div><div class="meta"><span class="priority ${task.priority}">${priorityText[task.priority]}</span><span>${dueText(task.due)}</span></div></div>
      </div>`).join("") : `<div class="empty">计划已清空<br>今天可以轻松一下</div>`;
      save();
    }
    function render() { renderTasks(); renderPlan(); }
    function escapeHtml(text) { const div = document.createElement("div"); div.textContent = text; return div.innerHTML; }
    function dateFromParts(year, month, day) {
      const date = new Date(Number(year) || new Date().getFullYear(), Number(month) - 1, Number(day));
      return date.toLocaleDateString("sv-SE");
    }
    function weekdayDate(weekday, nextWeek = false) {
      const date = new Date();
      const current = date.getDay() || 7;
      let offset = Number(weekday) - current;
      if (nextWeek) offset += offset > 0 ? 7 : 14;
      else if (offset < 0) offset += 7;
      date.setDate(date.getDate() + offset);
      return date.toLocaleDateString("sv-SE");
    }
    function resolveDueDate(text) {
      const exact = text.match(/(?:(\d{4})[年/-])?(\d{1,2})[月/-](\d{1,2})日?/);
      if (exact) return dateFromParts(exact[1], exact[2], exact[3]);
      const nextWeekday = text.match(/下周([一二三四五六日天])/);
      const weekdayMap = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 日: 7, 天: 7 };
      if (nextWeekday) return weekdayDate(weekdayMap[nextWeekday[1]], true);
      if (/周末/.test(text)) return weekdayDate(6);
      if (/后天/.test(text)) return localDate(2);
      if (/明天/.test(text)) return localDate(1);
      if (/今天/.test(text)) return localDate();
      return "";
    }
    function inferredPriority(text, due) {
      const diff = due ? daysUntil(due) : 9999;
      let priority = diff <= 1 ? "high" : diff <= 7 ? "medium" : "low";
      if (/记得|别忘了|一定要|务必|尽快/.test(text)) priority = priority === "low" ? "medium" : "high";
      return priority;
    }
    function extractTitle(text) {
      const verb = text.match(/(?:做|交|完成|复习|写|准备|提交|整理)(.+)/);
      let title = verb ? verb[0] : text;
      title = title
        .replace(/^(?:今天|明天|后天|周末|下周[一二三四五六日天]|\d{1,4}[年/-]\d{1,2}[月/-]\d{1,2}日?)/, "")
        .replace(/^(?:上午|下午|晚上|早上)?\d{1,2}(?:点|:)\d{0,2}(?:分)?(?:前|之前)?/, "")
        .replace(/^(?:记得|别忘了|一定要|务必|尽快|要|需要|得)+/, "")
        .replace(/[，。；;,.！!？?]/g, "")
        .trim();
      return title || text.trim();
    }
    function extractItems(text) {
      return text
        .split(/[，。；;,\n]+|(?:然后|另外|还有|以及)/)
        .map(segment => segment.trim())
        .filter(Boolean)
        .map((segment, index) => {
          const due = resolveDueDate(segment);
          return { id: Date.now() + index, title: extractTitle(segment), due, priority: inferredPriority(segment, due), selected: true };
        });
    }
    function renderDrafts() {
      $("extract-preview").classList.toggle("visible", extractedDrafts.length > 0);
      $("extract-summary").textContent = `已提取 ${extractedDrafts.length} 项，确认后可批量加入`;
      $("draft-list").innerHTML = extractedDrafts.map(draft => `<div class="draft-item ${draft.selected ? "" : "muted"}">
        <div><div class="draft-title">${escapeHtml(draft.title)}</div><div class="meta"><span class="priority ${draft.priority}">${priorityText[draft.priority]}优先级</span><span>${draft.due ? dueText(draft.due) : "未识别日期"}</span></div></div>
        <div class="draft-actions"><button class="icon-btn ${draft.selected ? "selected" : ""}" data-draft-action="toggle" data-draft-id="${draft.id}" title="确认加入">✓</button><button class="icon-btn" data-draft-action="remove" data-draft-id="${draft.id}" title="移除">✗</button></div>
      </div>`).join("");
    }

    $("extract-btn").addEventListener("click", () => {
      const text = $("extract-text").value.trim();
      if (!text) return;
      extractedDrafts = extractItems(text);
      renderDrafts();
    });
    $("draft-list").addEventListener("click", event => {
      const button = event.target.closest("[data-draft-action]");
      if (!button) return;
      const id = Number(button.dataset.draftId);
      if (button.dataset.draftAction === "toggle") {
        const draft = extractedDrafts.find(item => item.id === id);
        draft.selected = !draft.selected;
      } else {
        extractedDrafts = extractedDrafts.filter(item => item.id !== id);
      }
      renderDrafts();
    });
    $("batch-add").addEventListener("click", () => {
      const selected = extractedDrafts.filter(draft => draft.selected);
      if (!selected.length) return;
      const timestamp = Date.now();
      tasks.unshift(...selected.map((draft, index) => ({ id: timestamp + index, title: draft.title, priority: draft.priority, due: draft.due, completed: false, createdAt: timestamp + index })));
      extractedDrafts = [];
      $("extract-text").value = "";
      renderDrafts();
      generatePlan();
      renderTasks();
    });
    $("add-form").addEventListener("submit", event => {
      event.preventDefault();
      const title = $("new-title").value.trim();
      if (!title) return;
      tasks.unshift({ id: Date.now(), title, priority: $("new-priority").value, due: $("new-date").value, completed: false, createdAt: Date.now() });
      $("new-title").value = "";
      $("new-date").value = localDate();
      generatePlan();
      renderTasks();
    });
    $("task-list").addEventListener("click", event => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const id = Number(button.dataset.id);
      const task = tasks.find(item => item.id === id);
      if (button.dataset.action === "toggle") task.completed = !task.completed;
      if (button.dataset.action === "delete") tasks = tasks.filter(item => item.id !== id);
      if (button.dataset.action === "edit") {
        editingId = id;
        $("edit-title").value = task.title;
        $("edit-priority").value = task.priority;
        $("edit-date").value = task.due;
        $("modal").classList.add("open");
        return;
      }
      save(); render();
    });
    $("edit-form").addEventListener("submit", event => {
      event.preventDefault();
      const task = tasks.find(item => item.id === editingId);
      task.title = $("edit-title").value.trim();
      task.priority = $("edit-priority").value;
      task.due = $("edit-date").value;
      $("modal").classList.remove("open");
      save(); render();
    });
    $("cancel-edit").addEventListener("click", () => $("modal").classList.remove("open"));
    $("modal").addEventListener("click", event => { if (event.target === $("modal")) $("modal").classList.remove("open"); });
    $("open-settings").addEventListener("click", () => {
      $("github-token").value = localStorage.getItem(GITHUB_TOKEN_KEY) || "";
      $("settings-modal").classList.add("open");
    });
    $("close-settings").addEventListener("click", () => $("settings-modal").classList.remove("open"));
    $("settings-modal").addEventListener("click", event => { if (event.target === $("settings-modal")) $("settings-modal").classList.remove("open"); });
    $("settings-form").addEventListener("submit", async event => {
      event.preventDefault();
      const nextToken = $("github-token").value.trim();
      if (!nextToken) {
        setSyncState("请输入仅有 gist 权限的 GitHub Token", "error");
        return;
      }
      if (nextToken !== localStorage.getItem(GITHUB_TOKEN_KEY)) localStorage.removeItem(GIST_ID_KEY);
      localStorage.setItem(GITHUB_TOKEN_KEY, nextToken);
      try {
        await syncNow();
        $("settings-modal").classList.remove("open");
      } catch {}
    });
    $("sync-now").addEventListener("click", async () => {
      const nextToken = $("github-token").value.trim() || localStorage.getItem(GITHUB_TOKEN_KEY);
      if (!nextToken) {
        setSyncState("请先输入 GitHub Token", "error");
        return;
      }
      if (nextToken !== localStorage.getItem(GITHUB_TOKEN_KEY)) localStorage.removeItem(GIST_ID_KEY);
      localStorage.setItem(GITHUB_TOKEN_KEY, nextToken);
      try { await syncNow(); } catch {}
    });
    $("disable-sync").addEventListener("click", () => {
      localStorage.removeItem(GITHUB_TOKEN_KEY);
      localStorage.removeItem(GIST_ID_KEY);
      $("github-token").value = "";
      setSyncState("同步已停用，本机数据仍保留。");
    });
    $("nav").addEventListener("click", event => {
      const button = event.target.closest("[data-view]");
      if (!button) return;
      currentView = button.dataset.view;
      document.querySelectorAll(".nav-btn").forEach(item => item.classList.toggle("active", item === button));
      $("view-title").textContent = titles[currentView];
      renderTasks();
    });
    $("search").addEventListener("input", renderTasks);
    $("sort").addEventListener("change", renderTasks);
    $("refresh-plan").addEventListener("click", generatePlan);
    $("plan-list").addEventListener("dragstart", event => { event.target.classList.add("dragging"); event.dataTransfer.setData("text/plain", event.target.dataset.planId); });
    $("plan-list").addEventListener("dragend", event => event.target.classList.remove("dragging"));
    $("plan-list").addEventListener("dragover", event => event.preventDefault());
    $("plan-list").addEventListener("drop", event => {
      event.preventDefault();
      const movingId = Number(event.dataTransfer.getData("text/plain"));
      const target = event.target.closest("[data-plan-id]");
      if (!target || Number(target.dataset.planId) === movingId) return;
      const targetId = Number(target.dataset.planId);
      plan.splice(plan.indexOf(movingId), 1);
      plan.splice(plan.indexOf(targetId), 0, movingId);
      save(); renderPlan();
    });

    async function initApp() {
      $("date-line").textContent = new Intl.DateTimeFormat("zh-CN", { month: "long", day: "numeric", weekday: "long" }).format(new Date());
      $("new-date").value = localDate();
      const hasToken = Boolean(localStorage.getItem(GITHUB_TOKEN_KEY));
      if (hasToken) cloudApplying = true;
      render();
      if (hasToken) {
        try { await pullCloudData(); }
        catch (error) { cloudApplying = false; setSyncState(error.message, "error"); }
      } else {
        setTimeout(() => $("settings-modal").classList.add("open"), 450);
      }
    }
    initApp();
  </script>
</body>
</html>
